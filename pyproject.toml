[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haberbul"
version = "0.1.0"
description = "Son dakika ve gundem haberlerini toplayip puanlayan, editor paneli icin taslak ureten servis"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "jinja2",
  "sqlalchemy>=2",
  "alembic",
  "psycopg[binary]>=3",
  "apscheduler>=3,<4",
  "httpx",
  "feedparser",
  "rapidfuzz",
  "anthropic",
  "pydantic-settings",
  "itsdangerous",
  "python-multipart",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools]
packages = ["gundem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
